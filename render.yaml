services:
  # ====================================================
  # ResolveFlow_AI Backend Server (Express + Socket.IO)
  # ====================================================
  - type: web
    name: resolveflow-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        fromService:
          type: web
          name: resolveflow-frontend
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MONGODB_URI
        sync: false

  # ====================================================
  # ResolveFlow_AI Frontend Web App (Next.js)
  # ====================================================
  - type: web
    name: resolveflow-frontend
    runtime: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: resolveflow-backend
          property: host
          path: /api
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: resolveflow-backend
          property: host
